.main-nav{position:absolute;left:0;top:25%;width:148px;background:var(--glass);border-radius:0 25px 25px 0;backdrop-filter:blur(18px);padding:6px 7px 9px 0;pointer-events:auto;display:grid;gap:2px}.nav-button{border:0;background:transparent;min-height:54px;border-radius:17px;display:flex;align-items:center;gap:15px;padding:12px 18px 12px 26px;text-align:left;width:100%;font-size:14px;transition:background .2s,box-shadow .2s;white-space:nowrap}.nav-button:hover{background:#b3b6dc24}.nav-button.active{background:linear-gradient(115deg,#929bce77,#9a94c578);box-shadow:inset 0 1px 1px #e3dff226}.nav-button[data-panel=camera].active{width:max-content;min-width:100%;padding-right:22px}.nav-button .icon{width:25px;height:25px}

.camera-compass{position:absolute;right:31px;bottom:42px;width:196px;pointer-events:auto;text-align:center}.compass{position:relative;width:188px;height:188px;border:1px solid #e8e3ec7d;border-radius:50%;margin:auto;background:rgba(85,105,141,.12);overflow:hidden;box-shadow:inset 0 0 36px #6d6d8e11}.compass canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.27}.compass-rose{position:absolute;inset:0;transition:transform .2s linear}.compass-rose:before,.compass-rose:after{content:"";position:absolute;background:#dfdeec44}.compass-rose:before{left:50%;top:20px;bottom:20px;width:1px}.compass-rose:after{top:50%;left:20px;right:20px;height:1px}.compass-letter{position:absolute;font-size:12px;color:#f4eef0}.north{top:7px;left:calc(50% - 4px)}.south{bottom:6px;left:calc(50% - 4px)}.east{right:7px;top:calc(50% - 7px)}.west{left:7px;top:calc(50% - 7px)}.compass-aircraft{position:absolute;top:calc(50% - 20px);left:calc(50% - 18px);width:36px;height:40px;fill:#fff7f0;stroke:none}.compass-heading{position:absolute;bottom:28px;left:0;right:0;font-size:10px;color:#eee7ec;letter-spacing:1px}.camera-switch{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:5px}.camera-switch button{background:none;border:0;padding:8px;min-width:32px;min-height:38px}.camera-switch .icon{width:15px;height:15px}.camera-name{font-size:13px;color:#fff3ec;min-width:124px}
